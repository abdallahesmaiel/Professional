<!-- Compare Floating Bar -->
<div class="compare-floating" id="compareFloating">
  <span class="count" id="compareCount">0</span>
  <span>مقارنة المنتجات</span>
  <button class="discovery-btn" id="openCompareBtn" style="background:var(--accent);color:var(--primary-dark);border:none;">عرض</button>
  <button class="discovery-btn" id="clearCompareBtn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.25);">مسح</button>
</div>

<!-- Compare Modal -->
<div class="modal-overlay" id="compareModal">
  <div class="modal-card compare-modal-wrap">
    <h3>⚖️ مقارنة المنتجات</h3>
    <div id="compareContent" style="overflow:auto;margin-top:14px;"></div>
    <div class="action-buttons">
      <button class="btn btn-outline" id="closeCompareBtn">إغلاق</button>
    </div>
  </div>
</div>

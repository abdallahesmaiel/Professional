<!-- Refund Success Modal -->
<div class="refund-success-modal" id="refundSuccessModal">
  <div class="modal-content">
    <div class="modal-icon success" id="refundModalIcon">
      <i class="fa-solid fa-check"></i>
    </div>
    <h3 id="refundModalTitle" style="color:var(--primary-dark);font-size:22px;font-weight:900;margin-bottom:12px;">تم استعادة أموالك!</h3>
    <p id="refundModalMessage" style="color:var(--gray-600);font-size:14px;line-height:1.9;margin-bottom:20px;">
      تم إرجاع الكميات واسترداد المبلغ بنجاح.<br>
      شكراً لك على تعاملك معنا.
    </p>
    <div id="refundModalAmount" style="font-size:28px;font-weight:900;color:var(--success);margin-bottom:20px;"></div>
    <button id="refundModalClose" style="padding:12px 32px;border-radius:99px;background:linear-gradient(135deg,var(--primary),var(--primary-medium));color:white;border:none;font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(74,44,23,0.25);">
      حسناً، شكراً
    </button>
  </div>
</div>

<!-- Top Bar -->
<header class="top-bar">
  <div class="top-container">
    <div class="top-left">
      <button class="hamburger-btn" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="brand-name">
        <span class="main">سوق بروفيشنال <span class="highlight">✦</span></span>
        <span class="sub">Professional Souq</span>
        <span class="sub-en">Premium • Quality • Luxury</span>
      </div>
    </div>
    <div class="logo-ring"></div>
    <div class="logo-area" id="logoArea" title="الرئيسية">
      <div class="logo-img" id="logoDisplay"><i class="fas fa-gem" style="color: var(--accent);"></i></div>
    </div>
    <div class="top-right">
      <div class="top-actions">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="ar">ع</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="top-action-btn" id="wishlistBtn" title="المفضلة">
          <i class="fa-regular fa-heart"></i>
          <span class="badge hidden" id="wishlistBadge">0</span>
        </button>
        <div class="cart-widget-top" id="cartWidgetTop" role="button">
          <span class="cart-count-badge-top" id="cartCountTop">0</span>
          <svg class="mk-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20.2" r="1.6"/><circle cx="18" cy="20.2" r="1.6"/><path d="M2 3h3l2.7 11.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 7H6"/></svg>
          <span class="cart-label">السلة</span>
        </div>
      </div>
    </div>
  </div>
</header>

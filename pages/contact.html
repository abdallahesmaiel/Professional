  <!-- Contact Us Page -->
  <div id="contactPage" class="page">
    <div class="contact-page-container">
      <h1 class="contact-title">تواصل <span class="highlight">معنا</span></h1>
      <div class="contact-card">
        <div class="contact-info-grid" id="contactInfoGrid"><div class="loading-spinner" style="grid-column:1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</div></div>
        <div class="contact-form-area">
          <h3 style="font-size:20px;font-weight:800;color:var(--primary-dark);margin-bottom:16px;">📝 أرسل رسالتك</h3>
          <div class="form-group"><label>📧 البريد الإلكتروني</label><input type="email" id="contactEmail" placeholder="example@email.com"></div>
          <div class="form-group"><label>📝 الموضوع</label><input type="text" id="contactSubject" placeholder="موضوع الرسالة"></div>
          <div class="form-group"><label>✏️ الرسالة</label><textarea id="contactMessage" placeholder="اكتب رسالتك هنا..."></textarea></div>
          <button class="btn btn-primary" id="sendContactBtn" style="width:100%;justify-content:center;"><i class="fa-solid fa-paper-plane"></i> إرسال</button>
        </div>
      </div>
    </div>
  </div>
